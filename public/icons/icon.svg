  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#111827" filter="url(#shadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="98" fill="url(#pwaGrad)" opacity="0.15"/>
  <rect x="30" y="30" width="452" height="452" rx="96" fill="none" stroke="url(#pwaGrad)" stroke-width="6"/>
  
